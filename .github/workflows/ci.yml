name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lean Rust bootstrap gates only — not full workspace/all-targets CI.
  # Does not duplicate dependency-audit, gas-benchmarks, verify-contracts,
  # routing-benchmarks, or Postgres/Redis API integration.
  rust-fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  rust-lean-checks:
    name: Rust Lean Clippy + Lib Tests (excl. api/contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-rust-lean-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rust-lean-
      - name: Clippy (workspace libs/bins, exclude contracts)
        # No --all-targets: deferred cfg(test)/integration compile failures
        # (api replay helpers, indexer amm_ingest). Exact lean CI command.
        run: cargo clippy --workspace --all-features --exclude stellarroute-contracts -- -D warnings
      - name: Clippy (Soroban contracts libs/bins)
        # Separate package invocation (no --all-features, no --all-targets).
        # --all-targets deferred: contracts fuzz_targets fail under test cfg.
        run: cargo clippy -p stellarroute-contracts -- -D warnings
      - name: Library unit tests (exclude api and contracts)
        # --lib skips integration tests. contracts excluded for pre-existing
        # cfg(test) compile debt (fuzz_targets). Exact lean CI command.
        run: >
          cargo test --workspace --lib
          --exclude stellarroute-contracts
          --exclude stellarroute-api

  # Focused swap prepare/submit + OpenAPI/AssetPath wire contract tests.
  # These use lazy Postgres pools / in-memory stores — no external DB required.
  rust-api-swap-contract-tests:
    name: Rust API Swap + OpenAPI Contract Tests (no external DB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-api-swap-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-api-swap-
            ${{ runner.os }}-cargo-rust-lean-
      - name: Swap + OpenAPI contract integration tests
        run: >
          cargo test -p stellarroute-api
          --test swap_integration
          --test swap_submit_integration
          --test openapi_swap_contract
      - name: API library unit tests
        # Included when green; not a substitute for --all-targets / ignored DB tests.
        run: cargo test -p stellarroute-api --lib

  sdk-checks:
    name: JS SDK Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: sdk-js/package-lock.json
      - name: Install dependencies
        run: cd sdk-js && npm ci --legacy-peer-deps
      - name: Build
        run: cd sdk-js && npm run build
      - name: Typecheck
        run: cd sdk-js && npm run typecheck
      - name: Run tests
        run: cd sdk-js && npm test

  frontend-lint:
    name: Frontend ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Lint frontend
        run: npm --prefix frontend run lint

  frontend-build:
    name: Frontend Production Build
    needs: frontend-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Performance budget check
        run: npm --prefix frontend run perf:check:ci
        continue-on-error: false
        env:
          CI: "true"

  frontend-tests:
    name: Frontend Unit Tests (${{ matrix.label }})
    needs: frontend-lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: hooks
            suite: hooks
          - label: lib
            suite: lib
          - label: app
            suite: app
          - label: components (swap-card)
            suite: components/swap/SwapCard.test.tsx
          - label: components (swap)
            suite: components/swap
            exclude_args: --exclude '**/SwapCard.test.tsx'
          - label: components (shared)
            suite: components/shared
          - label: components (providers)
            suite: components/providers
          - label: components (settings)
            suite: components/settings
          - label: components (rest)
            suite: components
            exclude_args: >-
              --exclude 'components/swap/**'
              --exclude 'components/shared/**'
              --exclude 'components/providers/**'
              --exclude 'components/settings/**'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Run frontend tests
        run: |
          if [[ "${{ matrix.suite }}" == components* ]]; then
            npm --prefix frontend run test -- ${{ matrix.suite }} --pool=forks --maxWorkers=1 ${{ matrix.exclude_args }}
          else
            npm --prefix frontend run test -- ${{ matrix.suite }}
          fi
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          CI: "true"

  frontend-storybook:
    name: Frontend Ladle Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Build Ladle stories
        run: npm --prefix frontend run storybook:ci
      - name: Upload storybook build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ladle-storybook
          path: frontend/build/
          if-no-files-found: error
          retention-days: 7
