[package]
name = "stellarroute-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "stellarroute-api"
path = "src/bin/stellarroute-api.rs"

[[bin]]
name = "replay-cli"
path = "src/bin/replay_cli.rs"

[[bin]]
name = "m2-readiness"
path = "src/bin/m2_readiness.rs"

[[bin]]
name = "cctp-live-readiness-probe"
path = "src/bin/cctp-live-readiness-probe.rs"

[[bin]]
name = "cctp-evm-signer"
path = "src/bin/cctp-evm-signer.rs"

[dependencies]
# Workspace dependencies
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-http.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
sqlx.workspace = true
chrono.workspace = true
uuid.workspace = true
config.workspace = true
redis.workspace = true
reqwest.workspace = true
rand.workspace = true
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
urlencoding = "2.1"
flate2 = "1"
brotli = "8"

# Internal dependencies
stellarroute-indexer = { path = "../indexer" }
stellarroute-routing = { path = "../routing" }

# Stellar transaction construction / envelope validation
stellar-xdr = { version = "23.0.0", features = ["std", "base64"] }
stellar-strkey = "0.0.16"
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc"] }

# API documentation
utoipa = { version = "4", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "6", features = ["axum"] }

# Concurrency utilities
parking_lot = "0.12"
arc-swap = { workspace = true }
dashmap = "5.5"

# Metrics
prometheus = { version = "0.14", default-features = false }
lazy_static = "1.4"

# EVM ABI encoding (Circle CCTP v2 calldata)
alloy-primitives = "0.8"
alloy-sol-types = "0.8"

# CCTP attestation crypto (Apache-2.0 / MIT)
tiny-keccak = { version = "2.0", features = ["keccak"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }

# Async utilities
futures-util = "0.3"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.4", features = ["util"] }
proptest.workspace = true
tokio-tungstenite = "0.20"
futures-util = "0.3"
criterion = { version = "0.5", features = ["html_reports"] }
wiremock = "0.6"
# Integration-test signing helpers (tests/common) — not exported from the lib.
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc"] }
stellar-xdr = { version = "23.0.0", features = ["std", "base64"] }
stellar-strkey = "0.0.16"
sha2 = "0.10"

[[bench]]
name = "quote_serialization"
harness = false
