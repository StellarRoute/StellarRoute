# Example Cloudflare Tunnel ingress for StellarRoute API on Oracle VM.
# Copy to ~/.cloudflared/config.yml after `cloudflared tunnel create`.
# See docs/deployment/oracle-always-free.md.

tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: /home/ubuntu/.cloudflared/REPLACE_WITH_TUNNEL_UUID.json

ingress:
  - hostname: api.example.com
    service: http://127.0.0.1:8080
  - service: http_status:404
